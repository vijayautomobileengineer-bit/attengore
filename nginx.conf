server {
    listen 80;
    server_name _;  # Replace _ with your domain or VPS IP if you have one

    # Serve the React frontend from /clowi/
    location /clowi/ {
        alias /var/www/attengore/dist/;
        try_files $uri $uri/ /clowi/index.html;
    }

    # Proxy all /api/ requests to the Express backend on port 5000
    location /api/ {
        proxy_pass http://localhost:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}
