<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <!-- Outer ring: nearly complete circle with a small gap -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#29c4f0" stroke-width="5"
    stroke-dasharray="278 11" stroke-linecap="round" transform="rotate(-100 50 50)"/>

  <!-- Second ring: two arcs -->
  <circle cx="50" cy="50" r="37" fill="none" stroke="#1db3e0" stroke-width="5"
    stroke-dasharray="150 82" stroke-dashoffset="-30" stroke-linecap="round" transform="rotate(-100 50 50)"/>
  <circle cx="50" cy="50" r="37" fill="none" stroke="#1db3e0" stroke-width="5"
    stroke-dasharray="50 182" stroke-dashoffset="-210" stroke-linecap="round" transform="rotate(-100 50 50)"/>

  <!-- Third ring: two arcs -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="#13a0cf" stroke-width="5"
    stroke-dasharray="110 66" stroke-dashoffset="10" stroke-linecap="round" transform="rotate(-100 50 50)"/>
  <circle cx="50" cy="50" r="28" fill="none" stroke="#13a0cf" stroke-width="5"
    stroke-dasharray="45 131" stroke-dashoffset="-160" stroke-linecap="round" transform="rotate(-100 50 50)"/>

  <!-- Inner ring: arc -->
  <circle cx="50" cy="50" r="19" fill="none" stroke="#0e8dbf" stroke-width="5"
    stroke-dasharray="80 39" stroke-dashoffset="-5" stroke-linecap="round" transform="rotate(-100 50 50)"/>

  <!-- Clock hand pointing to ~1 o'clock -->
  <line x1="50" y1="50" x2="66" y2="21" stroke="#0a7aad" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="50" cy="50" r="4" fill="#0a7aad"/>
</svg>
