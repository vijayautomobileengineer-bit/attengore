<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Google Accounts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Roboto', sans-serif; }</style>
</head>
<body class="bg-[#f0f4f9] min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-[450px] bg-white rounded-3xl p-8 border border-stone-200 shadow-xl flex flex-col justify-between min-h-[420px]">
    <div>
      <!-- Google Logo -->
      <div class="flex justify-center mb-6">
        <svg class="w-8 h-8" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
      </div>

      <h1 class="text-2xl text-center text-stone-850 font-normal mb-1">Sign in with Google</h1>
      <p class="text-center text-stone-500 text-sm mb-6">to continue to <strong class="text-stone-800 font-semibold">Clowi Attendance</strong></p>

      <!-- Status -->
      <div id="status" class="text-center text-sm text-stone-500 py-6">
        <div class="flex flex-col items-center gap-3">
          <svg class="w-8 h-8 animate-spin text-blue-500" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
          </svg>
          <p>Connecting to Google…</p>
        </div>
      </div>

      <div id="error-box" class="hidden bg-red-50 border border-red-200 rounded-2xl p-4 text-sm text-red-700 text-center"></div>
    </div>

    <!-- Footer -->
    <div class="mt-8 pt-4 border-t border-stone-100 flex items-center justify-between text-xs text-stone-400">
      <span>English (United States)</span>
      <div class="flex gap-3">
        <a href="#" class="hover:text-stone-600 transition">Help</a>
        <a href="#" class="hover:text-stone-600 transition">Privacy</a>
        <a href="#" class="hover:text-stone-600 transition">Terms</a>
      </div>
    </div>
  </div>

  <!-- Firebase SDK (compat for popup pages) -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBmYPvgVVKbrRUmqpGMORzsZPOtO4X4WZw",
      authDomain: "clowi-cattd.firebaseapp.com",
      projectId: "clowi-cattd",
      storageBucket: "clowi-cattd.firebasestorage.app",
      messagingSenderId: "418062327499",
      appId: "1:418062327499:web:992ddb3fa830b0a441454e",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const statusEl   = document.getElementById('status');
    const errorBox   = document.getElementById('error-box');

    try {
      const result = await signInWithPopup(auth, provider);
      const firebaseUser = result.user;

      // Look up user in Clowi by email
      const email = firebaseUser.email.toLowerCase();
      const clowiData = JSON.parse(localStorage.getItem('clowi_data') || '{"users":[]}');
      const matchedUser = clowiData.users?.find(u => u.email.toLowerCase() === email);

      if (matchedUser) {
        // Send back to main Clowi window
        window.opener?.postMessage({ type: 'oauth-success', provider: 'Google', user: matchedUser }, '*');
        statusEl.innerHTML = '<p class="text-green-600 font-semibold">✅ Signed in! Closing…</p>';
        setTimeout(() => window.close(), 800);
      } else {
        // User authenticated with Google but not registered in Clowi
        // Send their Google profile so Clowi can pre-fill registration
        window.opener?.postMessage({
          type: 'oauth-new-user',
          provider: 'Google',
          profile: {
            name: firebaseUser.displayName || '',
            email: firebaseUser.email || '',
            photoURL: firebaseUser.photoURL || '',
          }
        }, '*');
        statusEl.innerHTML = `
          <div class="text-center">
            <p class="text-amber-700 font-semibold mb-1">✨ Google account verified!</p>
            <p class="text-stone-500 text-xs">No Clowi account for <strong>${firebaseUser.email}</strong>.<br/>Redirecting to registration…</p>
          </div>`;
        setTimeout(() => window.close(), 1800);
      }
    } catch (err) {
      statusEl.classList.add('hidden');
      errorBox.classList.remove('hidden');
      if (err.code === 'auth/popup-closed-by-user') {
        errorBox.textContent = 'Sign-in was cancelled.';
      } else if (err.code === 'auth/unauthorized-domain') {
        errorBox.innerHTML = `<strong>Unauthorized domain.</strong><br>Add <code>localhost</code> to Firebase → Authentication → Authorized domains.`;
      } else {
        errorBox.textContent = err.message;
      }
      setTimeout(() => window.close(), 3000);
    }
  </script>
</body>
</html>
